spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/classsync?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:classsync}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.uploads-dir=${UPLOADS_DIR:./uploads}
app.bootstrap.email=${CR_EMAIL:cr@classsync.local}
app.bootstrap.password=${CR_PASSWORD:}
app.bootstrap.name=${CR_NAME:Class Representative}
